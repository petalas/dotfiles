name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install test shell
        run: |
          command -v zsh >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y zsh
          }

      - name: ShellCheck Bash files
        run: |
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning --exclude=SC1090
          shellcheck --severity=warning --exclude=SC1090 install lib/install-plan tools/generate-brewfile tools/run-install-tui .githooks/pre-commit

      - name: Shell syntax
        run: |
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(git ls-files -z '*.sh')
          bash -n install lib/install-plan tools/generate-brewfile tools/run-install-tui .githooks/pre-commit
          zsh -n dot/zshrc dot/*.zsh update-dotfiles

      - name: Go tests
        run: go test ./...

      - name: Deterministic tests
        run: ./tests/run.sh

  macos-arm:
    name: macOS arm64 smoke
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Test visual helper
        run: go test ./...

      - name: Test Apple Bash compatibility
        run: /bin/bash ./tests/test-macos-arm.sh

      - name: Test dotfile links with macOS utilities
        run: /bin/bash ./tests/test-link-path.sh

  yazi-latest:
    name: Latest Yazi compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test managed config against latest stable Yazi
        run: ./tests/test-yazi-config.sh
