name: Live removal adapter smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1"

jobs:
  apt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Exercise APT inspection, preview, removal, and reinspection
        run: |
          docker run --rm -v "$PWD:/repo:ro" debian:bookworm bash -ceu '
            apt-get update
            apt-get install -y sl
            /repo/tests/live/test-removal-adapter.sh debian apt-package sl
          '

  pacman:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Exercise pacman inspection, removal, and reinspection
        run: |
          docker run --rm -v "$PWD:/repo:ro" archlinux:latest bash -ceu '
            pacman -Syu --noconfirm tree
            /repo/tests/live/test-removal-adapter.sh arch pacman-package tree
          '

  homebrew:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Exercise the complete macOS inspection event stream
        run: |
          go build -o /tmp/dotfiles-tui ./cmd/dotfiles-tui
          observations=$(mktemp)
          /tmp/dotfiles-tui run -- ./lib/install-plan inspect --os macos --output "$observations" > /tmp/inspection-progress
          expected=$(awk -F '\t' 'NF >= 4 && $1 !~ /^#/ { count++ } END { print count }' catalog/applications.tsv)
          grep -Fq "$expected/$expected settled" /tmp/inspection-progress
          grep -Fq 'Run settled successfully.' /tmp/inspection-progress
      - name: Exercise Homebrew inspection, removal, and reinspection
        run: |
          brew install hello
          ./tests/live/test-removal-adapter.sh macos brew-formula hello
