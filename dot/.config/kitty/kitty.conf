font_family                 family="Hack Nerd Font Mono"
# font_family                 family="DejavuSansM Nerd Font Mono"
# font_family                 family="Iosevka Nerd Font Mono"
# font_family                 family="FiraCode Nerd Font Mono"
font_size                   14
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.99
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# Animated cursor follows text (ml4w arch setup; absent on other machines).
# globinclude (rather than include) so kitty stays silent when the file is
# missing. Paths must be RELATIVE to this config file's directory —
# kitty rejects absolute/$HOME patterns for globinclude.
globinclude ../ml4w/settings/kitty-cursor-trail.conf

# Use the dark theme as the fallback; kitty's *.auto.conf files override it
# when the OS reports a light or dark color scheme.
globinclude ../../.cache/wal/colors-kitty.conf
include themes/seashells.conf

cursor_trail                3
cursor_trail_decay          0.1 0.4
